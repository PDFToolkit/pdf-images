name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, zlib
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: composer check
      - run: python -m pip install --require-hashes -r tools/validation-requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils imagemagick
      - name: Generate and validate the module example
        run: |
          mkdir -p /tmp/pdf-images-examples
          php examples/image-files.php /tmp/pdf-images-examples/image-files.pdf
          qpdf --check /tmp/pdf-images-examples/image-files.pdf
      - name: Verify PDF semantics with an independent reader
        run: python tools/validate_example.py /tmp/pdf-images-examples/image-files.pdf
      - name: Verify packed, sixteen-bit, Adam7 and ICC PNG conversion
        run: python tools/validate_png.py --report /tmp/pdf-images-examples/png-validation.json
      - name: Verify JPEG ICC profiles and Adobe CMYK/YCCK rendering
        run: python tools/validate_jpeg.py --report /tmp/pdf-images-examples/jpeg-validation.json
